<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>soundcraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #12141a;
      --bg-elev: #1a1d26;
      --bg-soft: #222632;
      --line: #2e3444;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #e8a54b;
      --accent-dim: rgba(232, 165, 75, 0.16);
      --ok: #5ecf9a;
      --err: #e86a6a;
      --run: #6aa8e8;
      --radius: 10px;
      --font-display: "Syne", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #243049 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #2a2218 0%, transparent 50%),
        var(--bg);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.45;
    }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 24px 48px;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2rem, 4vw, 2.75rem);
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1;
    }

    .brand span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(94, 207, 154, 0.18); }
    .dot.bad { background: var(--err); }

    button.ghost {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    button.ghost:hover { border-color: var(--accent); color: var(--accent); }
    button.ghost.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .panel {
      background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      backdrop-filter: blur(8px);
      animation: rise 0.5s ease-out both;
    }

    .panel.hidden { display: none; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    label.field-label {
      display: block;
      color: var(--muted);
      margin-bottom: 8px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      padding: 14px 16px;
      font: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    textarea:focus, input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    textarea::placeholder, input::placeholder { color: #5c6478; }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    @media (max-width: 800px) {
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    select, input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }
    select:focus, input[type="number"]:focus {
      border-color: var(--accent);
    }

    .row-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      user-select: none;
      cursor: pointer;
    }
    .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

    button.generate, button.primary {
      appearance: none;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #1a1208;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.02em;
      padding: 12px 28px;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease, opacity 0.12s;
    }
    button.generate:hover:not(:disabled),
    button.primary:hover:not(:disabled) { filter: brightness(1.05); transform: translateY(-1px); }
    button.generate:active:not(:disabled),
    button.primary:active:not(:disabled) { transform: translateY(0); }
    button.generate:disabled, button.primary:disabled { opacity: 0.55; cursor: wait; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin: 10px 0 0;
    }

    .warn {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, var(--err) 40%, var(--line));
      background: rgba(232, 106, 106, 0.08);
      color: var(--err);
      font-size: 12px;
    }
    .warn.hidden { display: none; }

    .settings-grid {
      display: grid;
      gap: 16px;
      margin-top: 4px;
    }

    .settings-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
      align-items: center;
    }

    .masked {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .ok-msg {
      color: var(--ok);
      font-size: 12px;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: rise 0.55s ease-out 0.08s both;
    }

    .results h2, .panel h2 {
      margin: 0 0 4px;
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .job {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .job.running { border-color: color-mix(in srgb, var(--run) 55%, var(--line)); }
    .job.succeeded { border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
    .job.failed { border-color: color-mix(in srgb, var(--err) 45%, var(--line)); }

    .job-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--bg-soft);
      color: var(--muted);
    }
    .badge.running { color: var(--run); background: rgba(106, 168, 232, 0.12); }
    .badge.succeeded { color: var(--ok); background: rgba(94, 207, 154, 0.12); }
    .badge.failed { color: var(--err); background: rgba(232, 106, 106, 0.12); }

    .prompt-line {
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .meta { color: var(--muted); font-size: 12px; }

    .files { display: flex; flex-direction: column; gap: 10px; }

    .file {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .path {
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }

    audio {
      width: 100%;
      height: 36px;
    }

    .error-text { color: var(--err); }

    footer {
      margin-top: auto;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    footer code {
      color: var(--text);
      background: var(--bg-soft);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1 class="brand">sound<span>craft</span></h1>
      <div class="header-right">
        <div class="status" id="apiStatus">
          <span class="dot" id="apiDot"></span>
          <span id="apiLabel">checking API…</span>
        </div>
        <button class="ghost" type="button" id="settingsToggle">Settings</button>
      </div>
    </header>

    <section class="panel hidden" id="settingsPanel">
      <h2>Settings</h2>
      <p class="hint">API keys are saved on this Mac (Application Support). Leave a field blank to keep the current value.</p>
      <div class="settings-grid">
        <div>
          <label class="field-label" for="replicateToken">Replicate API Token (MusicGen)</label>
          <input id="replicateToken" type="password" autocomplete="off" placeholder="r8_…" />
          <div class="masked" id="replicateMasked"></div>
        </div>
        <div>
          <label class="field-label" for="geminiKey">Gemini API Key (Lyria3)</label>
          <input id="geminiKey" type="password" autocomplete="off" placeholder="AIza…" />
          <div class="masked" id="geminiMasked"></div>
        </div>
        <div>
          <label class="field-label" for="lmUrl">LM Studio URL (optional)</label>
          <input id="lmUrl" type="text" placeholder="http://localhost:1234" />
        </div>
        <div>
          <label class="field-label" for="lmModel">LM Studio Model (optional)</label>
          <input id="lmModel" type="text" placeholder="liquid/lfm2-24b-a2b" />
        </div>
        <div>
          <label class="field-label">Output folder</label>
          <div class="meta" id="outputDir">—</div>
        </div>
      </div>
      <div class="settings-actions">
        <button class="primary" type="button" id="saveSettingsBtn">Save</button>
        <button class="ghost" type="button" id="openOutputBtn">Open output folder</button>
        <span class="ok-msg hidden" id="settingsSaved">Saved</span>
      </div>
    </section>

    <section class="panel" id="composePanel">
      <label class="field-label" for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="暗い、鼓動、インスタレーション / dark ambient drone, heavy reverb"></textarea>

      <div class="controls">
        <div class="control">
          <label class="field-label" for="backend">Backend</label>
          <select id="backend">
            <option value="musicgen">MusicGen</option>
            <option value="lyria3">Lyria3</option>
          </select>
        </div>
        <div class="control" id="modelControl">
          <label class="field-label" for="model">Model</label>
          <select id="model">
            <option value="melody-large">melody-large</option>
            <option value="stereo-melody-large">stereo-melody-large</option>
            <option value="large">large</option>
            <option value="stereo-large">stereo-large</option>
          </select>
        </div>
        <div class="control" id="durationControl">
          <label class="field-label" for="duration">Duration (s)</label>
          <input id="duration" type="number" min="1" max="120" value="30" />
        </div>
        <div class="control">
          <label class="field-label" for="count">Variations</label>
          <input id="count" type="number" min="1" max="10" value="1" />
        </div>
      </div>

      <div class="row-actions">
        <label class="toggle">
          <input type="checkbox" id="raw" />
          Skip LLM refine (--raw)
        </label>
        <button class="generate" id="generateBtn" type="button">Generate</button>
      </div>
      <p class="hint" id="backendHint">MusicGen → Replicate WAV · Lyria3 → Gemini MP3 (30s fixed)</p>
      <div class="warn hidden" id="keyWarn"></div>
    </section>

    <section class="results" id="resultsSection">
      <h2>Results</h2>
      <div id="jobs"><div class="empty">生成結果がここに並びます</div></div>
    </section>

    <footer>
      <span>Local API also at <code id="apiUrl">/health</code> · TD: <code>POST /jobs</code></span>
      <span>v0.4.0</span>
    </footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const jobsEl = $("jobs");
    const known = new Map();
    let settingsCache = null;

    function setApiStatus(ok, detail) {
      $("apiDot").className = "dot " + (ok ? "ok" : "bad");
      $("apiLabel").textContent = detail;
    }

    function syncBackendUi() {
      const lyria = $("backend").value === "lyria3";
      $("modelControl").style.opacity = lyria ? "0.4" : "1";
      $("durationControl").style.opacity = lyria ? "0.4" : "1";
      $("model").disabled = lyria;
      $("duration").disabled = lyria;
      $("backendHint").textContent = lyria
        ? "Lyria3 → Gemini MP3 · duration/model ignored (30s clip)"
        : "MusicGen → Replicate WAV · optional LM Studio refine";
      updateKeyWarn();
    }

    function updateKeyWarn() {
      const warn = $("keyWarn");
      const btn = $("generateBtn");
      if (!settingsCache) {
        warn.classList.add("hidden");
        return;
      }
      const lyria = $("backend").value === "lyria3";
      const missing = lyria
        ? !settingsCache.gemini_api_key_set
        : !settingsCache.replicate_api_token_set;
      if (missing) {
        warn.textContent = lyria
          ? "Gemini API key is not set. Open Settings and add GEMINI_API_KEY."
          : "Replicate token is not set. Open Settings and add REPLICATE_API_TOKEN.";
        warn.classList.remove("hidden");
        btn.disabled = false;
      } else {
        warn.classList.add("hidden");
      }
    }

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        if (!res.ok) throw new Error("bad status");
        const data = await res.json();
        setApiStatus(true, "API online · " + location.host + (data.version ? " · v" + data.version : ""));
      } catch {
        setApiStatus(false, "API offline");
      }
    }

    async function loadSettings() {
      const res = await fetch("/settings");
      if (!res.ok) throw new Error("settings failed");
      settingsCache = await res.json();
      $("replicateMasked").textContent = settingsCache.replicate_api_token_set
        ? "Saved: " + settingsCache.replicate_api_token_masked
        : "Not set";
      $("geminiMasked").textContent = settingsCache.gemini_api_key_set
        ? "Saved: " + settingsCache.gemini_api_key_masked
        : "Not set";
      $("lmUrl").value = settingsCache.lm_studio_url || "";
      $("lmModel").value = settingsCache.lm_studio_model || "";
      $("outputDir").textContent = settingsCache.output_dir || "—";
      updateKeyWarn();
    }

    async function saveSettings() {
      const body = {
        lm_studio_url: $("lmUrl").value.trim(),
        lm_studio_model: $("lmModel").value.trim(),
      };
      const r = $("replicateToken").value.trim();
      const g = $("geminiKey").value.trim();
      if (r) body.replicate_api_token = r;
      if (g) body.gemini_api_key = g;

      const btn = $("saveSettingsBtn");
      btn.disabled = true;
      try {
        const res = await fetch("/settings", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "save failed");
        settingsCache = data;
        $("replicateToken").value = "";
        $("geminiKey").value = "";
        await loadSettings();
        const saved = $("settingsSaved");
        saved.classList.remove("hidden");
        setTimeout(() => saved.classList.add("hidden"), 2000);
      } catch (err) {
        alert(err.message || String(err));
      } finally {
        btn.disabled = false;
      }
    }

    function mediaUrl(path) {
      return "/media?path=" + encodeURIComponent(path);
    }

    function renderJob(job) {
      let el = known.get(job.id);
      if (!el) {
        el = document.createElement("article");
        el.className = "job";
        el.dataset.id = job.id;
        if (jobsEl.querySelector(".empty")) jobsEl.innerHTML = "";
        jobsEl.prepend(el);
        known.set(job.id, el);
      }

      el.className = "job " + job.status;
      const req = job.request || {};
      const refined = job.result?.prompt;
      const input = job.result?.input || req.prompt || "";
      const files = job.result?.files || [];

      el.innerHTML = `
        <div class="job-top">
          <span class="badge ${job.status}">${job.status}</span>
          <span class="meta">${req.backend || "?"} · ${job.id}</span>
        </div>
        <div class="prompt-line">${escapeHtml(refined || input)}</div>
        ${refined && refined !== input ? `<div class="meta">input: ${escapeHtml(input)}</div>` : ""}
        ${job.error ? `<div class="error-text">${escapeHtml(job.error)}</div>` : ""}
        <div class="files">
          ${files.map((f) => `
            <div class="file">
              <div class="path">${escapeHtml(f)}</div>
              <audio controls preload="metadata" src="${mediaUrl(f)}"></audio>
            </div>
          `).join("")}
        </div>
      `;
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function pollJob(id) {
      for (;;) {
        const res = await fetch("/jobs/" + id);
        if (!res.ok) throw new Error("job poll failed");
        const job = await res.json();
        renderJob(job);
        if (job.status === "succeeded" || job.status === "failed") return job;
        await new Promise((r) => setTimeout(r, 1500));
      }
    }

    async function generate() {
      const prompt = $("prompt").value.trim();
      if (!prompt) {
        $("prompt").focus();
        return;
      }

      if (settingsCache) {
        const lyria = $("backend").value === "lyria3";
        const missing = lyria
          ? !settingsCache.gemini_api_key_set
          : !settingsCache.replicate_api_token_set;
        if (missing) {
          showSettings(true);
          updateKeyWarn();
          return;
        }
      }

      const body = {
        prompt,
        backend: $("backend").value,
        model: $("model").value,
        duration: Number($("duration").value) || 30,
        count: Number($("count").value) || 1,
        raw: $("raw").checked,
      };

      const btn = $("generateBtn");
      btn.disabled = true;
      btn.textContent = "Generating…";

      try {
        const res = await fetch("/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const job = await res.json();
        if (!res.ok) {
          const detail = typeof job.detail === "string" ? job.detail : "request failed";
          throw new Error(detail);
        }
        renderJob(job);
        await pollJob(job.id);
      } catch (err) {
        alert(err.message || String(err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate";
      }
    }

    function showSettings(open) {
      const panel = $("settingsPanel");
      const toggle = $("settingsToggle");
      if (open === undefined) open = panel.classList.contains("hidden");
      panel.classList.toggle("hidden", !open);
      toggle.classList.toggle("active", open);
      toggle.textContent = open ? "Close settings" : "Settings";
    }

    $("settingsToggle").addEventListener("click", () => showSettings());
    $("saveSettingsBtn").addEventListener("click", saveSettings);
    $("openOutputBtn").addEventListener("click", async () => {
      try {
        await fetch("/settings/open-output", { method: "POST" });
        await loadSettings();
      } catch (err) {
        alert(err.message || String(err));
      }
    });
    $("backend").addEventListener("change", syncBackendUi);
    $("generateBtn").addEventListener("click", generate);
    $("prompt").addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") generate();
    });

    $("apiUrl").textContent = location.origin + "/health";
    syncBackendUi();
    checkHealth();
    loadSettings().catch(() => {});
    setInterval(checkHealth, 15000);
  </script>
</body>
</html>
