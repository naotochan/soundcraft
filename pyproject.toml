[project]
name = "soundcraft"
version = "0.4.0"
description = "CLI, GUI, desktop app, and local API for generating instrumental music via MusicGen and Lyria3"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "google-genai",
    "fastapi",
    "uvicorn[standard]",
    "pywebview",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
soundcraft = "soundcraft.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soundcraft = ["static/*"]
