[project]
name = "soundcraft"
version = "0.3.0"
description = "CLI, GUI, and local API for generating instrumental music via MusicGen and Lyria3"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "google-genai",
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
soundcraft = "soundcraft.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soundcraft = ["static/*"]
